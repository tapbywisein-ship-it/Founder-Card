[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

# Express backend. Inherits the container environment (DB URL, JWT secrets,
# Supabase keys, etc.) injected by docker-compose / App Service app settings.
[program:backend]
command=node dist/server.js
directory=/app/backend
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# nginx (serves SPA + proxies /api to the backend). priority>backend so it
# starts slightly after; autorestart covers the brief window before :3000 is up.
[program:nginx]
command=nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
